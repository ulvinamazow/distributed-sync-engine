services:
  postgres:
    image: postgres:16-alpine
    container_name: sync-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: sync.2004
      POSTGRES_DB: sync.db
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync -d sync"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
      
